<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const saved = localStorage.getItem('banan-theme');
        if (['default', 'indigo', 'matrix', 'solaris', 'rainbow', 'golden'].includes(saved)) {
          document.documentElement.setAttribute('data-theme', saved);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BananINT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
