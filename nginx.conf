server {
    listen 80;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml application/manifest+json application/xml;

    # Caching:
    # - /assets/ holds Vite's content-hashed bundles: cache forever.
    # - Other static files keep stable names (/img, /audio, favicon, blog-og.png...): one day.
    # - HTML (index.html, SPA fallback, prerendered blog pages) is revalidated on every load.

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Serve published articles directly; retire missing blog URLs permanently.
    location = /blog {
        add_header Cache-Control "no-cache" always;
        try_files /blog/index.html =404;
    }

    # Renamed articles: keep in sync with RENAMED_SLUGS in src/features/blog/articles/articlesData.ts.
    # Exact matches, because the ^~ /blog/ prefix below skips regex locations.
    location = /blog/guide-bourse-trading-dividendes {
        return 301 /blog/guide-bourse-trading;
    }

    location = /blog/guide-bourse-trading-dividendes/ {
        return 301 /blog/guide-bourse-trading;
    }

    location ^~ /blog/ {
        # Static files published under /blog/ (diagrams, images)
        location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico)$ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri @blog_redirect;
        }

        add_header Cache-Control "no-cache" always;
        try_files $uri/index.html $uri $uri/ @blog_redirect;
    }

    location @blog_redirect {
        return 301 /blog;
    }

    # Static files at stable URLs, and index.html for other app routes
    # (the fallback is an internal redirect to /index.html, which is served with no-cache).
    location / {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ /index.html;
    }

    # Handle 404
    error_page 404 /404;
}
