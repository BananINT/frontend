<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">La boucle du clicker BananINT</title>
  <desc id="desc">Cliquer, gagner des bananes, choisir une amélioration, observer la progression, puis recommencer.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#292c0e"/><stop offset="1" stop-color="#111309"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#faff00" stroke-width="2"/></marker>
  </defs>
  <rect width="960" height="260" rx="28" fill="#0c0d09"/>
  <g fill="url(#surface)" stroke="#faff00" stroke-opacity=".6" stroke-width="2">
    <rect x="26" y="61" width="164" height="90" rx="22"/>
    <rect x="260" y="61" width="194" height="90" rx="22"/>
    <rect x="524" y="61" width="194" height="90" rx="22"/>
    <rect x="788" y="61" width="146" height="90" rx="22"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="108" y="115">Cliquer</text>
    <text x="357" y="102"><tspan x="357">Gagner des</tspan><tspan x="357" dy="25">bananes</tspan></text>
    <text x="621" y="102"><tspan x="621">Choisir une</tspan><tspan x="621" dy="25">amélioration</tspan></text>
    <text x="861" y="102"><tspan x="861">Observer la</tspan><tspan x="861" dy="25">progression</tspan></text>
  </g>
  <g fill="none" stroke="#faff00" stroke-width="3" marker-end="url(#arrow)">
    <path d="M196 106h52"/>
    <path d="M460 106h52"/>
    <path d="M724 106h52"/>
    <path d="M861 160v48q0 20-20 20H109q-20 0-20-20v-45"/>
  </g>
  <text x="475" y="205" fill="#faff00" font-family="monospace" font-size="17" letter-spacing="3" text-anchor="middle">RECOMMENCER ↻</text>
</svg>
