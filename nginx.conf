server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Serve published articles directly; retire missing blog URLs permanently.
    location = /blog {
        try_files /blog/index.html =404;
    }

    location ^~ /blog/ {
        try_files $uri/index.html $uri $uri/ @blog_redirect;
    }

    location @blog_redirect {
        return 301 /blog;
    }

    # Serve index.html for other app routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle 404
    error_page 404 /404;
}
